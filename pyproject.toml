[project]
name = "streamlit-mealplan"
version = "0.1.0"
description = "Streamlit meal planner app"
requires-python = ">=3.11"
authors = [{ name = "Your Name" }]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-select = ["I"]
exclude = [".venv"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
